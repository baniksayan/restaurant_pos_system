    </filter>
    <filter id="glowAmber" x="18" y="10" width="220" height="226" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- soft ambient glow -->
  <ellipse cx="126" cy="207" rx="83" ry="13" fill="#FCD34D" opacity=".24" filter="url(#softShadowAmber)"/>
  <path d="M57 49C60 34 72 25 89 24L185 20C199 20 207 30 203 44L179 177C176 194 166 204 150 204H58C44 204 36 194 39 180L57 49Z"
