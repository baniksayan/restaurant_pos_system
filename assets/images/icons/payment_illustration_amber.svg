<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="paperFillAmber" x1="64" y1="34" x2="183" y2="203" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF5" stop-opacity=".96"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="strokeAmber" x1="52" y1="37" x2="188" y2="201" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset=".58" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="foldAmber" x1="154" y1="28" x2="203" y2="74" gradientUnits="userSpaceOnUse">
