  <!-- text lines -->
  <path d="M91 75L169 72" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" opacity=".85"/>
  <path d="M84 111L151 109" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" opacity=".85"/>
  <path d="M77 148L133 146" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" opacity=".85"/>

